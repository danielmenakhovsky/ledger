<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e0f11">
<title>Расходы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #0e0f11; --ink: #ecedee; --ink2: #a4a8ae; --mute: #6c7077; --accent: #8fb3ff; --line: rgba(255,255,255,.09); --neg: #ff8a80; --warn: #e6b450; --pos: #6fdc9a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif; }
  body { padding: 10px 20px calc(32px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  i { font-style: normal; color: var(--mute); }
  .num { font-variant-numeric: tabular-nums; }
  nav { display: flex; align-items: center; justify-content: space-between; height: 40px; color: var(--ink2); }
  .month { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); }
  .month button { width: 32px; height: 40px; font-size: 20px; color: var(--ink2); text-align: center; }
  .month button:first-child { margin-left: -10px; }
  .month button:disabled { opacity: .25; }
  .cur { display: flex; gap: 2px; }
  .cur button { width: 32px; height: 40px; text-align: center; font-weight: 600; color: var(--mute); }
  .cur button.on { color: var(--ink); }
  .crumb { color: var(--mute); }
  .link { color: var(--accent); font-weight: 500; }
  section { padding: 22px 0 6px; border-top: 1px solid var(--line); }
  section.top { border-top: 0; padding: 18px 0 26px; }
  .title { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .total { font-size: 46px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .meta { color: var(--ink2); margin-top: 8px; }
  .meta b { color: var(--ink); font-weight: 600; }
  h2 { font-size: 13px; font-weight: 500; color: var(--mute); margin: 0 0 10px; }
  .cat { display: block; width: 100%; padding: 8px 0 10px; }
  .cat:active { opacity: .6; }
  .row, .kv, .day, .tx { display: flex; justify-content: space-between; gap: 14px; }
  .row i, .kv i { margin-left: 8px; display: inline-block; min-width: 30px; text-align: right; }
  .bar { display: block; height: 2px; margin-top: 8px; background: var(--accent); border-radius: 1px; }
  /* r4, проверка: невыбранное приглушаем цветом, а не прозрачностью — --mute уже догнан до AA
     против фона; бледнее только полоска (не текст) */
  .sub .cat.off, .cat.dim, .sub .cat.off .num, .cat.dim .num { color: var(--mute); }
  .sub .cat.off .bar, .cat.dim .bar { opacity: .45; }
  .incbtn { display: block; width: 100%; }
  .s.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .incbtn:active { opacity: .6; }
  .kv { padding: 8px 0; }
  .kv > span:first-child { color: var(--ink2); }
  .day { color: var(--mute); font-size: 13px; margin: 18px 0 2px; }
  .day:first-of-type { margin-top: 0; }
  .tx { padding: 9px 0; }
  .tx .l { min-width: 0; }
  .tx .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx .r { text-align: right; flex-shrink: 0; }
  .s { color: var(--mute); font-size: 12.5px; margin-top: 2px; }
  .more { display: block; padding: 14px 0 4px; }
  .empty { color: var(--mute); margin: 4px 0 10px; }
  .msg { margin-top: 30vh; text-align: center; color: var(--ink2); padding: 0 20px; }
  .neg, .sub2 .num.neg { color: var(--neg); }
  .pos, .r .v.pos, .r.l3 .v.pos { color: var(--pos); }
  .mtop { padding: 6px 0 14px; }
  .mtop .title { font-size: 15px; color: var(--ink2); font-weight: 500; margin-bottom: 0; }
  .mtotal { font-size: 38px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
  .mtop .meta { margin-top: 4px; font-size: 14px; }
  .mlist { padding: 10px 0 4px; }
  .r { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .r .k { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r .k i { color: var(--mute); font-size: 13px; margin-left: 4px; }
  .r .v { flex-shrink: 0; }
  .r.l1 { padding: 5px 0; font-weight: 600; }
  .r.l1 .k i { font-weight: 400; }
  .r.l2 { padding: 3px 0 3px 12px; font-size: 14.5px; color: var(--ink2); }
  .r.l2 .v { color: var(--ink); }
  .r.l3 { padding: 2px 0 2px 24px; font-size: 13.5px; color: var(--ink2); }
  .r.l3 .v { color: var(--ink2); }
  .r .v.neg, .r.l3 .v.neg { color: var(--neg); }
  .mlist .gap { height: 1px; background: var(--line); margin: 8px 0; }
  .mrow { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 14px;
    min-height: 56px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .mrow:active { opacity: .6; }
  .mrow .ml { display: flex; flex-direction: column; min-width: 0; }
  .mrow .mt { font-weight: 600; }
  .mrow .ms { color: var(--mute); font-size: 12.5px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow .mv { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .mrow .chev { color: var(--mute); font-weight: 400; margin-left: 6px; }
  .mn { display: block; width: 100%; }
  .mn:active { opacity: .6; }
  .mn .big { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin: 2px 0 4px; }
  .acc { padding: 8px 0 2px; }
  .acc + .acc { margin-top: 4px; }
  .sub2 { display: flex; justify-content: space-between; gap: 14px; padding: 3px 0 3px 14px; color: var(--ink2); font-size: 14px; }
  .sub2 .num { color: var(--ink2); }
  .warn { color: var(--warn); }
  .grand { font-weight: 600; }
  .grand > span:first-child { color: var(--ink) !important; }
  footer { color: var(--mute); font-size: 12px; padding-top: 18px; border-top: 1px solid var(--line); margin-top: 16px; }
</style>
</head>
<body>
<div id="app"><div class="msg">Открываю...</div></div>
<script>
(() => {
  const $app = document.getElementById('app');
  const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  const MON_S = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  const WD = ['вс','пн','вт','ср','чт','пт','сб'];
  const SIGN = { RUB: '₽', USD: '$', EUR: '€' };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ── Telegram Mini App ──────────────────────────────────────────────────────
  // Вне телеги (обычный браузер) скрипт телеги тоже грузится, но initData пустая.
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTg = !!(tg && tg.initData);
  const ver = v => inTg && tg.isVersionAtLeast && tg.isVersionAtLeast(v);
  const haptic = kind => { try { if (ver('6.1')) kind === 'tap' ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred(kind); } catch (e) {} };

  // ── тема ───────────────────────────────────────────────────────────────────
  // Даня 21.11 r4: светлая тема телеги — «жёлтые цифры плохо читаются», серое на сером.
  // Цвета берём из themeParams (вне телеги — из системной темы), акценты свои для светлой
  // и тёмной, и каждый цвет догоняем до контраста WCAG AA с фактическим фоном: у кастомных тем
  // телеги фон бывает серым, и стандартный hint на нём не читается.
  const hex2rgb = h => { h = String(h || '').replace('#', ''); if (h.length === 3) h = h.replace(/./g, c => c + c); const n = parseInt(h, 16); return isNaN(n) || h.length !== 6 ? null : [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const rgb2hex = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
  const lum = c => { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
  const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  function ensure(color, bg, min) {          // тянем цвет к чёрному/белому, пока не хватит контраста
    let c = hex2rgb(color), b = hex2rgb(bg);
    if (!c || !b) return color;
    const to = lum(b) > 0.18 ? [0, 0, 0] : [255, 255, 255];
    for (let i = 0; i < 40 && contrast(c, b) < min; i++) c = c.map((v, k) => v + (to[k] - v) * 0.08);
    return rgb2hex(c);
  }
  const ACC = {   // свои акценты: красный минус, жёлтая пометка, зелёный плюс
    dark: { neg: '#ff8a80', warn: '#e6b450', pos: '#6fdc9a' },
    light: { neg: '#c62828', warn: '#8a5a00', pos: '#1b7f3b' },
  };
  const BASE = {
    dark: { bg: '#0e0f11', text: '#ecedee', sub: '#a4a8ae', hint: '#8b9096', link: '#8fb3ff' },
    light: { bg: '#ffffff', text: '#111214', sub: '#5c6066', hint: '#6b6f76', link: '#1f5fd6' },
  };
  function applyTheme() {
    const t = inTg ? (tg.themeParams || {}) : {};
    const sysLight = !inTg && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches;
    let bg = t.bg_color || (sysLight ? BASE.light.bg : BASE.dark.bg);
    let bgRgb = hex2rgb(bg) || [14, 15, 17];
    const dark = lum(bgRgb) <= 0.18;           // по фактическому фону, а не по названию темы
    // 21.11 16:28: Телеграм iOS 9.6 игнорирует setBottomBarColor и рисует полосу у «домой» своим #ececec;
    // на сером фоне темы (#c0c0c0) она торчит плашкой. В светлой теме берём фон #ececec — полоса сливается.
    // Не помогло — откат: ~/Downloads/ledger-backup/index_before_lightbg_1628.html
    if (inTg && !dark) { bg = '#ececec'; bgRgb = hex2rgb(bg); }
    const B = BASE[dark ? 'dark' : 'light'], A = ACC[dark ? 'dark' : 'light'];
    const P = {
      '--bg': bg,
      '--ink': ensure(t.text_color || B.text, bg, 7),
      '--ink2': ensure(t.subtitle_text_color || t.hint_color || B.sub, bg, 4.5),
      '--mute': ensure(t.hint_color || B.hint, bg, 4.5),
      '--accent': ensure(t.link_color || t.button_color || B.link, bg, 4.5),
      '--neg': ensure(A.neg, bg, 4.5),
      '--warn': ensure(A.warn, bg, 4.5),
      '--pos': ensure(A.pos, bg, 4.5),
      '--line': dark ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.12)',
    };
    const r = document.documentElement.style;
    Object.entries(P).forEach(([k, v]) => r.setProperty(k, v));
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = bg;
    window.__theme = P;                         // для проверки контраста
    if (!inTg) return;
    // Даня 21.11: внизу у полоски «домой» вылезала светлая скруглённая плашка — это нижняя полоса
    // телеги (bottom_bar_bg_color), которую приложение не красило. Красим всё в наш фон.
    try { if (ver('6.1')) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } } catch (e) {}
    try { if (ver('7.10')) tg.setBottomBarColor(bg); } catch (e) {}
  }
  applyTheme();
  if (!inTg && window.matchMedia) matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { applyTheme(); if (DATA) render(); });
  if (inTg) {
    tg.ready();
    tg.expand();
    try { if (ver('7.7')) tg.disableVerticalSwipes(); } catch (e) {}   // длинный список не закрывает приложение
    applyTheme();
    tg.onEvent('themeChanged', () => { applyTheme(); if (DATA) render(); });
  }
  // 21.11 16:00: диагностика плашки внизу — 5 быстрых тапов в любом месте показывают, что отдаёт Телеграм
  (function () {
    let n = 0, t0 = 0;
    document.addEventListener('click', () => {
      const now = Date.now(); n = now - t0 < 600 ? n + 1 : 1; t0 = now;
      if (n < 5 || !inTg) return; n = 0;
      const tp = tg.themeParams || {}, sa = tg.safeAreaInset || {}, csa = tg.contentSafeAreaInset || {};
      const lines = ['v ' + tg.version + ' · ' + tg.platform + ' · ' + tg.colorScheme,
        'bg ' + tp.bg_color + ' · sec ' + tp.secondary_bg_color + ' · bottom_bar ' + tp.bottom_bar_bg_color,
        'bottomBarColor ' + tg.bottomBarColor + ' · bgColor ' + tg.backgroundColor,
        'expanded ' + tg.isExpanded + ' · fullscreen ' + tg.isFullscreen + ' · vh ' + tg.viewportHeight + '/' + tg.viewportStableHeight + ' · win ' + innerHeight,
        'safe b ' + sa.bottom + ' · content safe b ' + csa.bottom];
      const d = document.createElement('pre');
      d.style.cssText = 'position:fixed;left:8px;right:8px;top:40%;z-index:99;background:#000;color:#0f0;font:12px/1.4 monospace;padding:10px;border-radius:8px;white-space:pre-wrap';
      d.textContent = lines.join('\n'); d.onclick = () => d.remove(); document.body.appendChild(d);
    });
  })();

  function fmt(x, cur, dec) {
    const a = Math.abs(x);
    const d = dec ?? ((cur === 'USD' || cur === 'USDT' || cur === 'EUR') && a < 100 ? (a < 10 ? 2 : 1) : 0);
    let s = a.toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/ /g, ' ');
    if (d && s.includes(',')) s = s.replace(/,?0+$/, '');
    const neg = x < 0 ? '−' : '';
    if (cur === 'USD') return neg + '$' + s;
    if (cur === 'RUB' || cur === 'EUR') return neg + s + ' ' + SIGN[cur];
    return neg + s + ' ' + cur;
  }

  // ── ключ ───────────────────────────────────────────────────────────────────
  // Приходит во фрагменте ссылки (#k=...). Телега дописывает свои параметры после
  // него через & (#k=...&tgWebAppData=...) — проверено запросом requestWebView
  // 30.10.2026. На сервер фрагмент не уходит. Запасные места: CloudStorage
  // телеги и localStorage — если когда-нибудь откроется без фрагмента.
  const cloud = {
    get: () => new Promise(res => {
      if (!ver('6.9')) return res(null);
      const t = setTimeout(() => res(null), 1500);
      try { tg.CloudStorage.getItem('exp_k', (err, v) => { clearTimeout(t); res(err ? null : v || null); }); }
      catch (e) { clearTimeout(t); res(null); }
    }),
    set: v => { try { if (ver('6.9')) tg.CloudStorage.setItem('exp_k', v); } catch (e) {} },
    del: () => { try { if (ver('6.9')) tg.CloudStorage.removeItem('exp_k'); } catch (e) {} },
  };
  const local = {
    get: () => { try { return localStorage.getItem('exp_k'); } catch (e) { return null; } },
    set: v => { try { localStorage.setItem('exp_k', v); } catch (e) {} },
    del: () => { try { localStorage.removeItem('exp_k'); } catch (e) {} },
  };

  async function readKey() {
    const h = location.hash.replace(/^#/, '');
    const m = h.match(/(?:^|[&?])k=([A-Za-z0-9_-]{20,})/);
    if (m) {
      cloud.set(m[1]); local.set(m[1]);
      // ключ не висит в адресной строке; параметры телеги оставляем как были
      const rest = h.replace(/(^|[&?])k=[A-Za-z0-9_-]+&?/, '$1').replace(/^[&?]/, '');
      history.replaceState(null, '', location.pathname + (rest ? '#' + rest : ''));
      return m[1];
    }
    return (await cloud.get()) || local.get();
  }
  const b64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));

  async function load() {
    const k = await readKey();
    if (!k) return fail('Нет ключа. Открой из бота: /expenses');
    let enc;
    try { enc = await (await fetch('data.json?t=' + Date.now(), { cache: 'no-store' })).json(); }
    catch (e) { return fail('Не загрузились данные. Проверь интернет.'); }
    try {
      const key = await crypto.subtle.importKey('raw', b64(k), 'AES-GCM', false, ['decrypt']);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(enc.iv) }, key, b64(enc.ct));
      return JSON.parse(new TextDecoder().decode(pt));
    } catch (e) {
      cloud.del(); local.del();
      return fail('Ключ не подходит. Открой заново из бота: /expenses');
    }
  }

  function fail(t) { $app.innerHTML = `<div class="msg">${esc(t)}</div>`; return null; }

  // ── экраны ─────────────────────────────────────────────────────────────────
  let DATA = null;
  const S = { cur: (() => { try { return localStorage.getItem('exp_cur') || 'USD'; } catch (e) { return 'USD'; } })(),
              month: null, cat: null, all: false, scroll: 0 };

  // категория — вложенный экран: в телеге системная кнопка «назад», в браузере своя
  function openCat(c) { S.scroll = window.scrollY; S.cat = c; S.sub = null; S.all = false; haptic('tap'); render(); window.scrollTo(0, 0); }
  function closeCat() { S.cat = null; S.inc = false; S.money = false; S.sub = null; S.all = false; haptic('tap'); render(); window.scrollTo(0, S.scroll); }
  // Даня 13.11: тап по «доход» на главной — отдельный экран доходов с крупной цифрой
  function openInc() { S.scroll = window.scrollY; S.inc = true; S.cat = null; haptic('tap'); render(); window.scrollTo(0, 0); }
  // Даня 21.11: «Мои деньги» — тап по строке на главной, отдельный экран со всеми счетами
  function openMoney() { S.scroll = window.scrollY; S.money = true; S.inc = false; S.cat = null; haptic('tap'); render(); window.scrollTo(0, 0); }
  if (inTg) tg.BackButton.onClick(() => { if (S.cat || S.inc || S.money) closeCat(); });

  function render() {
    const D = DATA;
    const val = e => (S.cur === 'USD' ? e.usd : e.rub) || 0;
    const now = new Date();
    const thisM = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const months = [...new Set([...D.expenses.map(e => e.d.slice(0, 7)), thisM])].sort();
    if (!S.month) S.month = thisM;
    const mi = months.indexOf(S.month);
    const [y, m] = S.month.split('-').map(Number);
    const monthName = MONTHS[m - 1][0].toUpperCase() + MONTHS[m - 1].slice(1) + ' ' + y;
    const otherCur = S.cur === 'USD' ? 'RUB' : 'USD';
    const otherVal = e => (S.cur === 'USD' ? e.rub : e.usd) || 0;

    const tx = D.expenses.filter(e => e.d.startsWith(S.month));
    const total = tx.reduce((s, e) => s + val(e), 0);
    const byCat = {};
    tx.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + val(e); });
    const shown = tx.filter(e => (!S.cat || e.cat === S.cat) && (!S.sub || (S.sub === 'dl') === !!e.dl))
      .sort((a, b) => b.d.localeCompare(a.d) || Number(b.id) - Number(a.id));

    if (inTg) (S.cat || S.inc || S.money) ? tg.BackButton.show() : tg.BackButton.hide();
    const cur = `<span class="cur"><button data-cur="USD" class="${S.cur === 'USD' ? 'on' : ''}">$</button><button data-cur="RUB" class="${S.cur === 'RUB' ? 'on' : ''}">₽</button></span>`;

    if (S.money && D.money) {
      $app.innerHTML = moneyScreen(D.money, cur);
      return bind(months, mi);
    }

    if (S.inc) {
      const all = (D.incomes || []);
      const incM = all.filter(r => r.d.startsWith(S.month)).sort((a, b) => b.d.localeCompare(a.d));
      const iv = r => (S.cur === 'USD' ? r.usd : r.rub) || 0;
      const io = r => (S.cur === 'USD' ? r.rub : r.usd) || 0;
      const itot = incM.reduce((s, r) => s + iv(r), 0);
      const left = itot - total;
      const bySrc = {};
      incM.forEach(r => { bySrc[r.src || 'без источника'] = (bySrc[r.src || 'без источника'] || 0) + iv(r); });
      const srcs = Object.entries(bySrc).sort((a, b) => b[1] - a[1]);
      const speak = srcs.length ? srcs[0][1] : 1;
      const byM = {};
      all.forEach(r => { const k = r.d.slice(0, 7); byM[k] = (byM[k] || 0) + iv(r); });
      const ms = Object.keys(byM).sort().reverse();
      const mpeak = Math.max(...Object.values(byM), 1);
      const avg = ms.length ? Object.values(byM).reduce((s, v) => s + v, 0) / ms.length : 0;
      const mLabel = k => { const [yy, mm] = k.split('-').map(Number); return MONTHS[mm - 1] + (yy !== now.getFullYear() ? ' ' + yy : ''); };
      $app.innerHTML = `
        <nav>
          <span class="month"><button id="prev" ${mi <= 0 ? 'disabled' : ''} aria-label="раньше">‹</button><span>${monthName}</span><button id="next" ${mi >= months.length - 1 ? 'disabled' : ''} aria-label="позже">›</button></span>
          ${cur}
        </nav>
        <section class="top">
          <div class="title">Доход${inTg ? '' : ` · <button class="link" id="back">к расходам</button>`}</div>
          <div class="total num">${fmt(itot, S.cur)}</div>
          <div class="meta num">≈ ${fmt(incM.reduce((s, r) => s + io(r), 0), otherCur)} · ${incM.length} ${plural(incM.length, 'поступление', 'поступления', 'поступлений')}</div>
          <div class="meta num">потрачено ${fmt(total, S.cur)} · ${left >= 0 ? 'осталось' : 'перерасход'} <b>${left >= 0 ? '+' : ''}${fmt(left, S.cur)}</b></div>
        </section>
        <section>
          <h2>Источники</h2>
          ${srcs.length ? srcs.map(([s, v]) => `
            <div class="cat">
              <span class="row"><span>${esc(s)}</span><span class="num">${fmt(v, S.cur)}<i>${itot ? Math.round(v / itot * 100) : 0}%</i></span></span>
              <span class="bar" style="width:${Math.max(1.5, v / speak * 100)}%"></span>
            </div>`).join('') : '<p class="empty">В этом месяце доходов нет</p>'}
        </section>
        ${incM.length ? `<section>
          <h2>Поступления</h2>
          ${incM.map(r => { const dt = new Date(r.d + 'T12:00:00'); return `<div class="tx">
            <div class="l"><div class="t">${esc(r.src || '—')}</div><div class="s one">${dt.getDate()} ${MON_S[dt.getMonth()]}${r.n ? ' · ' + esc(r.n) : ''}</div></div>
            <div class="r"><div class="num">${fmt(iv(r), S.cur)}</div><div class="s num">${r.c !== S.cur ? fmt(r.a, r.c) : ''}</div></div>
          </div>`; }).join('')}
        </section>` : ''}
        <section>
          <h2>По месяцам <i>в среднем ${fmt(avg, S.cur)}</i></h2>
          ${ms.map(k => `
            <button class="cat${k === S.month ? '' : ' dim'}" data-im="${k}">
              <span class="row"><span>${mLabel(k)}${k === thisM ? ' <i>идёт</i>' : ''}</span><span class="num">${fmt(byM[k], S.cur)}</span></span>
              <span class="bar" style="width:${Math.max(1.5, byM[k] / mpeak * 100)}%"></span>
            </button>`).join('')}
        </section>
        <footer>обновлено ${esc(D.updated)}</footer>`;
      $app.querySelectorAll('[data-im]').forEach(b => b.onclick = () => {
        const k = b.dataset.im; if (!months.includes(k)) months.push(k), months.sort();
        S.month = k; haptic('tap'); render();
      });
      return bind(months, months.indexOf(S.month));
    }

    if (S.cat) {
      const ct = byCat[S.cat] || 0;
      const st = S.sub ? shown.reduce((s, e) => s + val(e), 0) : ct;   // выбран подраздел — итог по нему
      $app.innerHTML = `
        <nav>${inTg ? `<span class="crumb">${monthName}</span>` : `<button class="link" id="back">‹ ${monthName}</button>`}${cur}</nav>
        <section class="top">
          <div class="title">${esc(S.cat)}${S.sub ? (S.sub === 'dl' ? ' · доставка' : ' · в заведениях') : ''}</div>
          <div class="total num">${fmt(st, S.cur)}</div>
          <div class="meta num">≈ ${fmt(shown.reduce((s, e) => s + otherVal(e), 0), otherCur)} · ${shown.length} ${plural(shown.length, 'запись', 'записи', 'записей')} · ${total ? Math.round(st / total * 100) : 0}% месяца</div>
        </section>
        ${subBlock(tx.filter(e => e.cat === S.cat), val, ct)}
        <section>${txList(shown, val)}</section>`;
      return bind(months, mi);
    }

    const inc = D.income[S.month];
    const incV = inc ? (S.cur === 'USD' ? inc.usd : inc.rub) : 0;
    const diff = incV - total;
    const noRate = tx.filter(e => e.usd == null).length;
    const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    const peak = cats.length ? cats[0][1] : 1;
    const byCur = {};
    tx.forEach(e => { const c = byCur[e.c] = byCur[e.c] || { a: 0, v: 0 }; c.a += e.a; c.v += val(e); });

    $app.innerHTML = `
      ${D.money ? moneyBlock(D.money) : ''}
      <nav>
        <span class="month"><button id="prev" ${mi <= 0 ? 'disabled' : ''} aria-label="раньше">‹</button><span>${monthName}</span><button id="next" ${mi >= months.length - 1 ? 'disabled' : ''} aria-label="позже">›</button></span>
        ${cur}
      </nav>
      <section class="top">
        <div class="total num">${fmt(total, S.cur)}</div>
        <div class="meta num">потрачено · ≈ ${fmt(tx.reduce((s, e) => s + otherVal(e), 0), otherCur)} · ${tx.length} ${plural(tx.length, 'запись', 'записи', 'записей')}${noRate ? ` · без курса ${noRate}` : ''}</div>
        <button class="meta num incbtn" id="inc">${inc ? `<span class="link">доход ${fmt(incV, S.cur)} ›</span> · ${diff >= 0 ? 'осталось' : 'перерасход'} <b>${diff >= 0 ? '+' : ''}${fmt(diff, S.cur)}</b>` : '<span class="link">доход за месяц не записан ›</span>'}</button>
      </section>

      <section>
        <h2>Категории</h2>
        ${cats.length ? cats.map(([c, v]) => `
          <button class="cat" data-cat="${esc(c)}">
            <span class="row"><span>${esc(c)}</span><span class="num">${fmt(v, S.cur)}<i>${total ? Math.round(v / total * 100) : 0}%</i></span></span>
            <span class="bar" style="width:${Math.max(1.5, v / peak * 100)}%"></span>
          </button>`).join('') : '<p class="empty">В этом месяце трат нет</p>'}
      </section>

      <section>
        <h2>Траты</h2>
        ${txList(shown, val)}
      </section>

      ${Object.keys(byCur).length ? `<section>
        <h2>Валюты</h2>
        ${Object.entries(byCur).sort((a, b) => b[1].v - a[1].v).map(([c, x]) => `
          <div class="kv"><span>${fmt(x.a, c)}</span><span class="num">${fmt(x.v, S.cur)} <i>${total ? Math.round(x.v / total * 100) : 0}%</i></span></div>`).join('')}
      </section>` : ''}

      <section>
        <h2>Долги <i>не в расходах</i></h2>
        ${D.debts.length ? D.debts.map(x => `<div class="kv"><span>${x.a > 0 ? 'я должен' : 'мне должен'} · ${esc(x.who)}</span><span class="num">${fmt(Math.abs(x.a), x.c)}</span></div>`).join('')
          : '<p class="empty">Долгов нет</p>'}
      </section>
      <footer>обновлено ${esc(D.updated)}</footer>`;
    bind(months, mi);
  }

  // ── Деньги сейчас ────────────────────────────────────────────────────────────
  // Снимок собирает scripts/money.py при каждой публикации (и раз в 3 часа): Bybit и Wise по API,
  // Райф/Т-Банк/нал — ручные строки с датой. Итог = всё − холды карты − мои долги.
  const mv = (M, usd) => S.cur === 'USD' || !M.usd_rub ? fmt(usd, 'USD') : fmt(usd * M.usd_rub, 'RUB');
  const mvOther = (M, usd) => S.cur === 'USD' ? (M.usd_rub ? fmt(usd * M.usd_rub, 'RUB') : '') : fmt(usd, 'USD');
  function qty(a, c) {
    if (['RUB', 'EUR', 'USD', 'USDT', 'USDC', 'THB', 'IDR'].includes(c)) return fmt(a, c === 'USDC' ? 'USDT' : c, ['USD', 'USDT', 'USDC', 'EUR'].includes(c) && Math.abs(a) < 10000 ? 2 : 0).replace('USDT', c);
    return a.toLocaleString('ru-RU', { maximumSignificantDigits: 6 }).replace(/ /g, ' ') + ' ' + c;
  }
  function dShort(s) { if (!s) return ''; const d = new Date(s.slice(0, 10) + 'T12:00:00'); return d.getDate() + ' ' + MON_S[d.getMonth()]; }
  function placeNote(p, short) {
    if (p.unknown) return `<span class="warn">${short ? 'не знаю' : 'не знаю — пришли скрин Джарвису'}</span>`;
    if (p.old) return `<span class="warn">API не ответил, на ${esc(dShort(p.at))} ${esc((p.at || '').slice(11))}</span>`;
    if (p.manual) return p.stale ? `<span class="warn">на ${esc(dShort(p.date))}, устарело</span>` : `на ${esc(dShort(p.date))}`;
    return '';
  }

  // Даня 21.11 r2: одна строка над месяцем. Цифра не зависит от месяца, поэтому стоит вне его
  // (под переключателем месяца читалась как ноябрьская и спорила с «осталось»). Детали — по тапу.
  const GEN = { 'Т-Банк': 'т-банка', 'Нал': 'нала', 'Райф': 'райфа' };
  function moneyBlock(M) {
    const sub = M.unknown.length
      ? `<span class="warn">без ${esc(M.unknown.map(n => GEN[n] || n).join(' и ').toLowerCase())}</span>`
      : 'все счета';  // 21.11 15:53 Даня: «сколько реально есть денег, без вычета долгов»
    return `<button class="mrow" id="money" aria-label="Мои деньги сейчас, подробно">
        <span class="ml"><span class="mt">Мои деньги</span><span class="ms">сейчас · ${sub}</span></span>
        <span class="mv num">${mv(M, M.gross)}<span class="chev">›</span></span>
      </button>`;
  }

  // Даня 21.11 r3: «поджать по вертикали, иначе информативность падает». Одна строка на место:
  // имя, количество серым, сумма справа. Позиции вложены в Unified вместо отдельного блока,
  // счёт с одной монетой — одной строкой, итог только сверху. Без линии под каждой строкой.
  function cq(a, c) {          // короткое количество для плотных строк
    if (['RUB', 'EUR', 'USD', 'USDT', 'USDC', 'THB', 'IDR'].includes(c)) return qty(a, c);
    return a.toLocaleString('ru-RU', { maximumSignificantDigits: 4 }).replace(/ /g, ' ') + ' ' + c;
  }
  const short = n => n.toLocaleString('ru-RU', { maximumSignificantDigits: 4 }).replace(/ /g, ' ');
  function moneyScreen(M, cur) {
    const pnl = v => `<span class="v num${v < 0 ? ' neg' : v > 0 ? ' pos' : ''}">${v >= 0 ? '+' : '−'}${mv(M, Math.abs(v))}</span>`;
    const val = usd => `<span class="v num">${mv(M, usd)}</span>`;
    const row = (cls, left, q, right) => `<div class="r ${cls}"><span class="k">${left}${q ? ` <i>${q}</i>` : ''}</span>${right}</div>`;
    const coinQ = x => x.c === 'USD' ? '' : cq(x.a, x.c);
    const rows = [];
    M.places.forEach(p => {
      if (p.unknown) { rows.push(row('l1', esc(p.name), '<span class="warn">не знаю</span>', '<span class="v num">—</span>')); return; }
      const one = !p.accounts && p.coins.length === 1 ? p.coins[0] : null;
      const note = placeNote(p);
      let q = one && !(one.c === 'RUB' && S.cur === 'RUB') ? coinQ(one) : '';
      if (note) q = (q ? q + ' · ' : '') + note;
      rows.push(row('l1', esc(p.name), q, val(p.usd)));
      if (!p.accounts && !one) p.coins.forEach(x => rows.push(row('l2', esc(x.c), coinQ(x), x.usd == null ? '<span class="v">курса нет</span>' : val(x.usd))));
      (p.accounts || []).slice().sort((x, y) => y.usd - x.usd).forEach(a => {
        const big = a.coins.length === 1 && !a.upl && !a.rest ? a.coins[0] : null;
        rows.push(row('l2', esc(a.name), big ? coinQ(big) : '', val(a.usd)));
        if (big) return;
        a.coins.forEach(x => rows.push(row('l3', esc(x.c), short(x.a), val(x.usd))));
        const pos = a.name === 'Unified' ? (p.positions || []) : [];
        pos.forEach(o => rows.push(row('l3', `${esc(o.sym)} ${esc(o.side)} x${esc(o.lev)}`, `${fmt(o.value, 'USD')} · ${short(o.entry)} → ${short(o.mark)}`, pnl(o.pnl))));
        if (a.upl && !pos.length) rows.push(row('l3', 'фьючерсы', '', pnl(a.upl)));
        if (a.rest) rows.push(row('l3', 'мелочь', '', val(a.rest)));
      });
      (p.holds || []).forEach(h => rows.push(row('l2', 'холд карты', esc(h.n), `<span class="v num">−${mv(M, h.usd)}</span>`)));
      if (p.id === 'bybit' || p.id === 'wise') rows.push('<div class="gap"></div>');
    });
    const owe = M.debts.filter(d => d.a > 0), owed = M.debts.filter(d => d.a < 0);
    const debtRows = owe.map(d => row('l1', `долг · ${esc(d.who)}`, qty(d.a, d.c), `<span class="v num">−${d.usd == null ? '?' : mv(M, d.usd)}</span>`))
      .concat(owed.map(d => row('l1', `мне должен · ${esc(d.who)}`, qty(-d.a, d.c) + ' · не в итоге', '<span class="v num">—</span>')));
    const unk = M.unknown.length ? `<span class="warn">без ${esc(M.unknown.map(n => GEN[n] || n).join(' и ').toLowerCase())}</span>` : '';
    return `
      <nav>${inTg ? '<span></span>' : '<button class="link" id="back">‹ к расходам</button>'}${cur}</nav>
      <section class="mtop">
        <div class="title">Мои деньги</div>
        <div class="mtotal num">${mv(M, M.gross)}</div>
        <div class="meta num">≈ ${mvOther(M, M.gross)} · на ${esc(M.at.slice(11))}${unk ? ' · ' + unk : ''}</div>
        ${M.owe || M.holds_usd ? `<div class="meta num">${M.holds_usd ? `холды карты −${mv(M, M.holds_usd)} уже вычтены` : ''}${M.holds_usd && M.owe ? ' · ' : ''}${M.owe ? `я должен ${mv(M, M.owe)}, без него ${mv(M, M.mine)}` : ''}</div>` : ''}
      </section>
      <section class="mlist">${rows.join('')}${debtRows.length ? '<div class="gap"></div>' + debtRows.join('') : ''}</section>
      <footer>${M.usd_rub ? `курс ЦБ ${M.usd_rub.toFixed(2).replace('.', ',')} ₽ · ` : ''}Bybit и Wise сами, остальное вручную${M.holds_usd ? '' : ' · холдов нет'}</footer>`;
  }

  function txList(shown, val) {
    const LIMIT = 40;
    const list = S.all ? shown : shown.slice(0, LIMIT);
    if (!list.length) return '<p class="empty">Пусто</p>';
    const days = {};
    list.forEach(e => (days[e.d] = days[e.d] || []).push(e));
    const dayTotal = d => shown.filter(e => e.d === d).reduce((s, e) => s + val(e), 0);
    return Object.entries(days).map(([d, es]) => {
      const dt = new Date(d + 'T12:00:00');
      return `<div class="day"><span>${dt.getDate()} ${MON_S[dt.getMonth()]}, ${WD[dt.getDay()]}</span><span class="num">${fmt(dayTotal(d), S.cur)}</span></div>` +
        es.map(e => `<div class="tx">
          <div class="l"><div class="t">${esc(e.n || e.cat)}</div>
            <div class="s">${[!S.cat && e.n ? esc(e.cat) : '', e.ap ? 'примерно' : ''].filter(Boolean).join(' · ')}</div></div>
          <div class="r"><div class="num">${e.usd == null ? fmt(e.a, e.c) : (e.ap ? '≈ ' : '') + fmt(val(e), S.cur)}</div>
            <div class="s num">${triple(e)}</div></div>
        </div>`).join('');
    }).join('') + (!S.all && shown.length > LIMIT ? `<button class="link more" id="more">Показать все ${shown.length}</button>` : '');
  }

  function triple(e) {
    const p = [fmt(e.a, e.c)];
    if (e.c !== 'RUB' && e.rub != null) p.push(fmt(e.rub, 'RUB'));
    if (e.c !== 'USD' && e.c !== 'USDT' && e.usd != null) p.push(fmt(e.usd, 'USD'));
    if (e.usd == null) p.push('курс позже');
    return p.join(' · ');
  }

  // Даня 31.10: в ресторанах подраздел «доставка» — две строки внутри категории, тап фильтрует список
  function subBlock(rows, val, ct) {
    if (!rows.some(e => e.dl)) return '';
    const parts = [['dl', 'доставка', rows.filter(e => e.dl)], ['in', 'в заведениях', rows.filter(e => !e.dl)]];
    const peak = Math.max(...parts.map(p => p[2].reduce((s, e) => s + val(e), 0)), 1);
    return `<section class="sub">${parts.map(([k, name, r]) => {
      const v = r.reduce((s, e) => s + val(e), 0);
      return `<button class="cat${S.sub && S.sub !== k ? ' off' : ''}" data-sub="${k}">
        <span class="row"><span>${name}</span><span class="num">${fmt(v, S.cur)}<i>${ct ? Math.round(v / ct * 100) : 0}%</i></span></span>
        <span class="bar" style="width:${Math.max(1.5, v / peak * 100)}%"></span></button>`;
    }).join('')}</section>`;
  }

  function bind(months, mi) {
    const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
    $app.querySelectorAll('[data-cur]').forEach(b => b.onclick = () => {
      if (S.cur === b.dataset.cur) return;
      S.cur = b.dataset.cur; haptic('tap');
      try { localStorage.setItem('exp_cur', S.cur); } catch (e) {}
      render();
    });
    $app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => openCat(b.dataset.cat));
    $app.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { S.sub = S.sub === b.dataset.sub ? null : b.dataset.sub; S.all = false; haptic('tap'); render(); });
    const go = d => { S.month = months[mi + d]; S.all = false; haptic('light'); render(); };
    on('prev', () => go(-1));
    on('next', () => go(1));
    on('back', closeCat);
    on('inc', openInc);
    on('money', openMoney);
    on('more', () => { S.all = true; haptic('tap'); render(); });
  }

  function plural(n, a, b, c) {
    const m10 = n % 10, m100 = n % 100;
    return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c;
  }

  load().then(D => { if (D) { DATA = D; if (/(^|[#&])v=inc\b/.test(location.hash)) S.inc = true; if (/(^|[#&])v=money\b/.test(location.hash)) S.money = true; render(); } });
})();
</script>
</body>
</html>
